name: Mobile CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  eas-build:
    name: EAS production build
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Suppress the "using Expo Go for production" advisory warning
      EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Warn if EXPO_TOKEN is not set
        if: ${{ env.EXPO_TOKEN == '' }}
        run: |
          echo "::warning::EXPO_TOKEN secret is not set — skipping EAS build."
          echo "Add it at: Settings > Secrets > Actions > New repository secret"

      # --no-wait: submit the build to Expo's servers and exit immediately.
      # Builds run remotely (20–30 min); no need to block the GitHub runner.
      - name: EAS Build — Android
        if: ${{ env.EXPO_TOKEN != '' }}
        run: npx --yes eas-cli build --platform android --profile production --non-interactive --no-wait

      # iOS build — disabled until Distribution Certificate is validated.
      # To enable: run `eas credentials --platform ios` locally once,
      # then uncomment the step below.
      #
      # - name: EAS Build — iOS
      #   if: ${{ env.EXPO_TOKEN != '' }}
      #   run: npx --yes eas-cli build --platform ios --profile production --non-interactive --no-wait
